<text x="277.5" y="103.0" text-anchor="middle" font-size="12.5" fill="#6b6b6b">miners, weights,</text>
<text x="277.5" y="120.0" text-anchor="middle" font-size="12.5" fill="#6b6b6b">design commitments</text>
<rect x="366" y="62" width="153" height="72" rx="8" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/>
<text x="442.5" y="94.5" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Circuit market</text>
