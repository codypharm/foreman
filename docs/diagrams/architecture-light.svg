<rect x="36" y="458" width="368" height="68" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="220.0" y="488.5" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">ForemanResults</text>
<text x="220.0" y="505.5" text-anchor="middle" font-size="12.5" fill="#6b6b6b">verdict and hash in storage, full result in the log</text>
