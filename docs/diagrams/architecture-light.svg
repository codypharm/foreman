<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Foreman architecture</title>
<desc id="d">A worker on Railway indexes TapeOut's contracts on BNB Chain every 5 minutes into Postgres and publishes changed results to ForemanResults on the X Layer testnet. The API reads the index and reads BNB Chain and X Layer live. The web app shows the results and reads published results back from X Layer in the browser.</desc>
